services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    restart: unless-stopped
    stop_grace_period: 30s

  beat:
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    restart: unless-stopped
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to your HTTPS API URL}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s